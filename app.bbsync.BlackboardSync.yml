app-id: app.bbsync.BlackboardSync
runtime: org.kde.Platform
runtime-version: '6.11'
sdk: org.kde.Sdk
base: com.riverbankcomputing.PyQt.BaseApp
base-version: '6.11'
command: blackboardsync
rename-icon: icon
finish-args:
  - --device=dri
  - --env=QTWEBENGINEPROCESS_PATH=/app/bin/QtWebEngineProcess
  - --filesystem=xdg-download
  - --share=network
  - --socket=fallback-x11
  - --socket=wayland
  - --talk-name=org.freedesktop.Notifications
  - --talk-name=org.kde.StatusNotifierWatcher
  - --share=ipc
cleanup-commands:
  - /app/cleanup-BaseApp.sh
modules:
  - python3-requirements.json
  - name: BlackboardSync
    buildsystem: simple
    build-commands:
      - pip3 install --verbose --exists-action=i --no-index --prefix=${FLATPAK_DEST}
        --no-deps . --no-build-isolation
      - install -Dm644 metadata/${FLATPAK_ID}.metainfo.xml -t ${FLATPAK_DEST}/share/metainfo
      - install -Dm644 metadata/${FLATPAK_ID}.desktop -t ${FLATPAK_DEST}/share/applications
      - install -Dm644 metadata/icon.svg -t ${FLATPAK_DEST}/share/icons/hicolor/scalable/apps/
    sources:
      - type: git
        url: https://github.com/sanjacob/BlackboardSync
        tag: 0.18.0
        commit: c8966a4f1ed09816b707f06cb45775fdd13ac089
        disable-shallow-clone: true
      - type: git
        url: https://github.com/sanjacob/app.bbsync.BlackboardSync.metadata
        tag: 0.18.0
        commit: 7a0500ad2fe1f9460e5a5f05945bf5920c0f5749
        dest: metadata
